<div class="login-wrapper">
  <!-- Animated Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-container">
    <div class="brand-section">
      <div class="logo-circle">🧠</div>
      <h1 class="brand-name">Mind-Guard</h1>
      <p class="brand-tagline">Cloud-Native Intelligence for Modern Mental Health</p>
    </div>

    <div class="login-card glass-panel">
      <div class="card-header">
        <h2>Secure Login</h2>
        <p>Welcome back to your safe space</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Account Email</label>
          <div class="input-wrapper">
            <span class="icon">📧</span>
            <input
              type="email"
              id="email"
              class="form-control-premium"
              formControlName="email"
              placeholder="name@example.com"
              [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
            />
          </div>
          <div class="invalid-feedback" *ngIf="submitted && f['email'].errors">
            {{ getErrorMessage('email') }}
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="icon">🔒</span>
            <input
              type="password"
              id="password"
              class="form-control-premium"
              formControlName="password"
              placeholder="••••••••"
              [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
            />
          </div>
          <div class="invalid-feedback" *ngIf="submitted && f['password'].errors">
            {{ getErrorMessage('password') }}
          </div>
        </div>

        <div class="error-banner" *ngIf="error">
          <span class="icon">⚠️</span> {{ error }}
        </div>

        <button type="submit" class="btn-premium btn-primary-premium btn-full" [disabled]="loading">
          <span *ngIf="!loading">Unlock Portal</span>
          <span *ngIf="loading" class="loader-group">
            <span class="spinner"></span> Authenticating...
          </span>
        </button>
      </form>

      <div class="card-footer">
        <p>Private Practice? <a [routerLink]="['/register']" class="link-accent">Join our Network</a></p>
      </div>
    </div>

    <footer class="login-footer">
      <span>&copy; 2026 Mind-Guard Clinical Systems. HIPAA Compliant End-to-End.</span>
    </footer>
  </div>
</div>
