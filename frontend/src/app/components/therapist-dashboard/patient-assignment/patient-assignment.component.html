<div class="patient-assignment-container">
  <div class="assignment-header">
    <button class="btn-back" (click)="goBackToDashboard()">← Back to Dashboard</button>
    <h1>Assign Patients</h1>
    <p class="subtitle">Search and assign unassigned patients to your care</p>
  </div>

  <div class="assignment-content">
    <div class="search-bar">
      <input
        type="text"
        placeholder="Search by name or email..."
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
        class="search-input"
      />
      <span class="search-icon">🔍</span>
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="error-message" *ngIf="error">
      {{ error }}
    </div>

    <div class="loading" *ngIf="loading">
      <p>Loading available patients...</p>
    </div>

    <div class="patients-grid" *ngIf="!loading && filteredPatients.length > 0">
      <div class="patient-card" *ngFor="let patient of filteredPatients">
        <div class="patient-info">
          <h3>{{ patient.patientName }}</h3>
          <p class="patient-email">{{ patient.patientEmail }}</p>
        </div>

        <div class="patient-actions">
          <button
            class="btn-assign"
            (click)="assignPatient(patient.patientId, patient.patientName)"
            [disabled]="assigningId === patient.patientId"
          >
            <span *ngIf="assigningId !== patient.patientId">Assign Patient</span>
            <span *ngIf="assigningId === patient.patientId">Assigning...</span>
          </button>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="!loading && filteredPatients.length === 0">
      <p>{{ searchTerm.trim() ? 'No patients match your search' : 'No unassigned patients available' }}</p>
    </div>
  </div>
</div>
