<div class="login-wrapper">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-container">
    <div class="brand-section">
      <div class="logo-circle">🧠</div>
      <h1 class="brand-name">Mind-Guard</h1>
      <p class="brand-tagline">Start your journey to mental wellness</p>
    </div>

    <div class="login-card glass-panel register-wide">
      <div class="card-header">
        <h2>Join our Network</h2>
        <p>Complete your profile to unlock clinical intelligence</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-control-premium" formControlName="firstName" placeholder="John">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" class="form-control-premium" formControlName="lastName" placeholder="Doe">
            </div>
        </div>

        <div class="form-group">
          <label>Choose Username</label>
          <input type="text" class="form-control-premium" formControlName="username" placeholder="johndoe123">
        </div>

        <div class="form-group">
          <label>Account Email</label>
          <input type="email" class="form-control-premium" formControlName="email" placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label>Create Password</label>
          <input type="password" class="form-control-premium" formControlName="password" placeholder="••••••••••••">
          <small class="helper-text">Min. 12 characters with Uppercase, Number & Symbol</small>
        </div>

        <div class="form-group">
          <label>Account Type</label>
          <select class="form-control-premium select-premium" formControlName="role">
            <option value="PATIENT">Patient (Self-Care)</option>
            <option value="THERAPIST">Therapist (Clinician)</option>
          </select>
        </div>

        <div class="error-banner" *ngIf="error">
           {{ error }}
        </div>

        <button type="submit" class="btn-premium btn-primary-premium btn-full" [disabled]="loading">
          <span *ngIf="!loading">Create My Account</span>
          <span *ngIf="loading" class="loader-group">
             <span class="spinner"></span> Preparing your portal...
          </span>
        </button>
      </form>

      <div class="card-footer">
        <p>Already a member? <a [routerLink]="['/login']" class="link-accent">Sign in</a></p>
      </div>
    </div>
  </div>
</div>
